<div class="max-w-6xl mx-auto px-4 lg:px-8 py-8">
  <!-- template -->

  <ng-container *ngIf="data; else loading">
    <div class="flex flex-col lg:flex-row gap-8">
      <img [src]="data.poster_path ? env.tmdbImageBaseUrl + '/w500' + data.poster_path : 'assets/images/no-poster.jpg'"
           class="w-64 rounded" alt="Affiche"/>
      <div class="flex-1">
        <h1 class="text-3xl font-bold mb-2">{{ data.title || data.name }}</h1>
        <div class="text-sm text-neutral-400 mb-4">{{ year }} • {{ genresList }}</div>
        <p class="text-neutral-200 mb-6">{{ data.overview }}</p>

        <div class="mb-2">
          <!-- Header -->
          <div class="flex items-start justify-between mb-6">
            <h1 class="text-lg font-medium text-white">Comment regarder ?</h1>
            <div class="relative">
              <select
                [(ngModel)]="region"
                (ngModelChange)="onCountryChange($event)"
                class="bg-transparent border border-gray-600 rounded-full px-4 py-1 text-sm text-white appearance-none cursor-pointer focus:outline-none focus:border-gray-400">
                <option
                  *ngFor="let r of regions"
                  [value]="r.iso_3166_1"
                  class="bg-gray-800">
                  {{ r.native_name }}
                </option>
              </select>
              <svg class="absolute right-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>

          <!-- Streaming Options -->
          <div class="space-y-0">

            <div *ngFor="let p of providers"
                 class="flex items-center justify-between bg-gray-950 hover:bg-gray-750 transition-colors duration-200 p-4 group">
              <div class="flex items-center space-x-4">
                <div class="text-cyan-400 font-bold text-lg">{{ p.provider_name }}</div>
                <span class="text-gray-300 text-sm">Disponible sur</span>
                <img
                  [src]="'https://image.tmdb.org/t/p/w92' + p.logo_path"
                  [alt]="p.provider_name" class="h-9 w-9 rounded"/>
              </div>
            </div>

          </div>
        </div>

        <div *ngIf="trailerKey" class="aspect-video">
          <iframe width="100%" height="100%" [src]="('https://www.youtube.com/embed/' + trailerKey) | safeUrl"
                  frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #loading>
    <div class="text-center text-neutral-400">Chargement…</div>
  </ng-template>
</div>
