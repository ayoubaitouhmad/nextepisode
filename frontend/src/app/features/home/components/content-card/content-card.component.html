<article class="bg-neutral-800 rounded-lg shadow-md overflow-hidden flex flex-col h-full">
  <div class="relative w-full h-48">
    <img *ngIf="content.poster_path" [src]="content.poster_path" [alt]="content.title"
         class="object-cover w-full h-full"/>
  </div>

  <div class="p-4 flex-1 flex flex-col">
    <div class="flex items-center justify-between">
      <h4 class="font-semibold line-clamp-1">{{ content.title }}</h4>
      <span class="flex items-center text-xs font-bold">
        <svg class="w-4 h-4 mr-1 text-amber-400 fill-current" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        {{ content.rating }}
      </span>
    </div>

    <p class="text-xs text-neutral-400 mt-1">{{ content.year }}</p>

    <div class="flex">
      <a *ngFor="let genre of content.genres" class="me-1 text-xs text-neutral-400 underline ">
        {{ genre.name }}
      </a>
    </div>

    <div class="mt-auto flex items-center justify-between pt-4 text-sm">
      <div class="rounded-xl">
        @if (content.streamingService && content.streamingService.logoUrl) {
          <img [src]="content.streamingService.logoUrl" [alt]="content.streamingService.name" class="h-12 p-1"/>
        }
      </div>

      <div class="flex space-x-2 text-neutral-400">
        <!-- Share Button -->
        <button (click)="onShare(); $event.stopPropagation()" class="list-button hover:text-white transition-colors"
                aria-label="Share movie">
          <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" fill="gray" width="15" height="15"
               viewBox="0 0 50 50">
            <path
              d="M20 25c0-3.589-1.899-6.725-4.739-8.489C13.731 15.557 11.931 15 10 15 4.486 15 0 19.486 0 25c0 5.514 4.486 10 10 10 2.051 0 3.949-.634 5.537-1.698C18.22 31.51 20 28.471 20 25zM21.957 24.34l10.347-5.174c-2.416-2.028-4.009-4.98-4.247-8.313l-10.217 5.108C20.219 18.025 21.772 20.996 21.957 24.34zM17.865 34.051l10.189 5.095c.237-3.333 1.829-6.287 4.241-8.317l-10.337-5.167C21.774 29.002 20.239 31.986 17.865 34.051zM40 0c-5.464 0-9.913 4.408-9.992 9.854C30.007 9.903 30 9.951 30 10c0 3.688 2.004 6.899 4.976 8.633C36.453 19.498 38.167 20 40 20c5.514 0 10-4.486 10-10S45.514 0 40 0zM40 30c-2.063 0-3.976.638-5.569 1.712C31.764 33.508 30 36.543 30 40c0 .015.002.028.002.042-.044.003-.083.011-.127.014l.131.065C30.072 45.579 34.527 50 40 50c5.514 0 10-4.486 10-10S45.514 30 40 30z"></path>
          </svg>
        </button>

        @if (auth.isAuthenticated()) {
          <button (click)="onAddToFavorites(); $event.stopPropagation()" class="list-button favorite"
                  [class.active]="isInFavorites" aria-label="Add to favorites">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l3.09 8.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </button>

          <!-- Watched Button -->
          <button (click)="onAddToWatched(); $event.stopPropagation()" class="list-button watched"
                  [class.active]="isInWatched" aria-label="Mark as watched">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </button>

          <!-- Watchlist Button -->
          <button (click)="onAddToWatchlist(); $event.stopPropagation()" class="list-button watchlist"
                  [class.active]="isInWatchlist" aria-label="Add to watchlist">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </button>

        }

        <!-- Favorite Button -->


      </div>
    </div>
  </div>
</article>
