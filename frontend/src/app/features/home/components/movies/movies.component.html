<div class="space-y-6">
  <!-- Filters Section -->
  <app-movie-filters
    [contentType]="contentType"
    (filtersChange)="onFiltersChange($event)">
  </app-movie-filters>

  <!-- Loading State -->
  @if (loading) {
    <div class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500"></div>
    </div>
  }

  <!-- Error State -->
  @if (error) {
    <div class="bg-red-900/20 border border-red-800 rounded-lg p-4 text-red-400">
      {{ error }}
    </div>
  }

  <!-- Results Info -->
  @if (!loading && items.length > 0) {
    <div class="flex items-center justify-between text-sm text-neutral-400">
      <span>Showing {{ items.length }} of {{ totalResults }} movies</span>
      <span>Page {{ currentPage }} of {{ totalPages }}</span>
    </div>
  }

  <!-- Content Grid -->
  <app-content-grid
    [items]="items"
    [loading]="loading"
    (shareItem)="onShareContent($event)"
    (addToFavorites)="onAddToFavorites($event)"
    (addToWatched)="onAddToWatched($event)"
    (addToWatchlist)="onAddToWatchlist($event)"
    (movieClick)="onOpenDetails($event)">
  </app-content-grid>

  <!-- Pagination -->
  @if (!loading && totalPages > 1) {
    <div class="flex justify-center items-center space-x-4">
      <button
        (click)="loadPreviousPage()"
        [disabled]="currentPage === 1"
        class="px-4 py-2 bg-neutral-800 rounded-lg hover:bg-neutral-700 disabled:opacity-50 disabled:cursor-not-allowed">
        Previous
      </button>
      <span class="text-sm text-neutral-300">Page {{ currentPage }} of {{ totalPages }}</span>
      <button
        (click)="loadNextPage()"
        [disabled]="currentPage === totalPages"
        class="px-4 py-2 bg-neutral-800 rounded-lg hover:bg-neutral-700 disabled:opacity-50 disabled:cursor-not-allowed">
        Next
      </button>
    </div>
  }
</div>
