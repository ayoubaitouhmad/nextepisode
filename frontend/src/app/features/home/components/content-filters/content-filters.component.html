<!-- Genres Section -->
<div class="mb-6">
  <h3 class="text-white font-semibold mb-2">Genres</h3>
  <div class="flex flex-wrap gap-2">
    <button *ngFor="let genre of genres" (click)="onGenreToggle(genre)"
            class="px-4 py-2 rounded-full text-sm font-medium transition"
            [ngClass]="{
              'bg-blue-600 text-white': filters.genres.includes(genre.id),
              'bg-gray-700 text-white hover:bg-gray-600': !filters.genres.includes(genre.id)
            }">
      {{ genre.name }}
    </button>
  </div>
</div>

<!-- Filter Options Grid -->
<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6 text-white">
  <div>
    <label>De l'année</label>
    <select class="w-full bg-gray-600 rounded p-2"
            [(ngModel)]="filters.yearFrom"
            (ngModelChange)="onYearFromChange($event)">
      <option *ngFor="let y of [1975,1980,1990,2000,2010,2025]" [value]="y">{{ y }}</option>
    </select>
  </div>
  <div>
    <label>À l'année</label>
    <select class="w-full bg-gray-600 rounded p-2"
            [(ngModel)]="filters.yearTo"
            (ngModelChange)="onYearToChange($event)">
      <option *ngFor="let y of [1975,1980,1990,2000,2010,2025]" [value]="y">{{ y }}</option>
    </select>
  </div>
  <div>
    <label>Langue</label>
    <select class="w-full bg-gray-600 rounded p-2"
            [(ngModel)]="filters.language"
            (ngModelChange)="onLanguageChange($event)">
      <option *ngFor="let language of languages" [value]="language.iso_639_1">{{ language.english_name }}</option>
    </select>
  </div>
  <div>
    <label>Durée</label>
    <select class="w-full bg-gray-600 rounded p-2"
            [(ngModel)]="filters.runtime"
            (ngModelChange)="onRuntimeChange($event)">

      <option value="{{ item.value }}" *ngFor="let item of runtimes | keyvalue">
        {{ capitalizeFirstLetter(item.key) }}
      </option>


    </select>
  </div>

  <app-autocomplete
    [personList]="people"
    (selected)="onSelected($event)"
    (queryChange)="onSearch($event)">
  </app-autocomplete>

  <div>
    <label>Mot-clé</label>
    <input class="w-full bg-gray-600 rounded p-2"
           [(ngModel)]="filters.keyword"
           (ngModelChange)="onKeywordChange($event)"/>
  </div>
  <div>
    <label>Sort by:</label>
    <select class="w-full bg-gray-600 rounded p-2"
            [(ngModel)]="filters.lookFor"
            (ngModelChange)="onLookForChange($event)">
      <option value="">Default filter</option>
      <option value="{{ item.key }}" *ngFor="let item of sortOptions | keyvalue">
        {{ capitalizeFirstLetter(item.value) }}
      </option>
    </select>
  </div>
  <div>
    <label>Filtre d'âge</label>
    <select class="w-full bg-gray-600 rounded p-2"
            [(ngModel)]="filters.ageFilter"
            (ngModelChange)="onAgeFilterChange($event)">
      <option>No Filter</option>
      <option *ngFor="let certificaton of certifications"
              [value]="certificaton.certification"
              [attr.data-descrption]="certificaton.meaning"
      >
        {{ certificaton.certification }}
      </option>
    </select>
  </div>
</div>

<!-- Streaming Services Section -->
<div class="mb-8">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-white text-lg font-semibold">Services de streaming</h3>
    <div class="flex items-center gap-2">
      <span class="text-gray-400 text-sm">Pays :</span>
      <select
        class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        [(ngModel)]="filters.country"
        (ngModelChange)="onCountryChange($event)">
        <option *ngFor="let r of regions" [value]="r.iso_3166_1">{{ r.native_name }}</option>
      </select>
    </div>
  </div>

  <div class="flex flex-wrap gap-2">
    <div *ngFor="let service of streamingServices"
         (click)="onStreamingServiceToggle(service.provider_id)"
         class="group relative cursor-pointer transition-all duration-300 ease-in-out hover:scale-[1.02]">

      <div
        class="relative bg-gray-800/50 backdrop-blur-sm rounded-lg px-4 py-3 border border-gray-700/50 hover:border-gray-600/70 transition-all duration-300"
        [ngClass]="{
             'bg-blue-900/30 border-blue-500/50 ring-1 ring-blue-400/30': filters.streamingServices.includes(service.provider_id),
             'hover:bg-gray-700/30': !filters.streamingServices.includes(service.provider_id)
           }">

        <div class="flex items-center gap-3 relative min-w-0">
          <div class="flex-shrink-0 w-8 h-8 flex items-center justify-center">
            <img [src]="service.logo_path"
                 [alt]="service.provider_name"
                 class="max-w-full max-h-full object-contain transition-all duration-300 group-hover:scale-110"
                 loading="lazy"/>
          </div>

          <span
            class="text-sm font-medium text-gray-300 group-hover:text-white transition-colors duration-300 whitespace-nowrap"
            [ngClass]="{'text-blue-300': filters.streamingServices.includes(service.provider_id)}">
            {{ service.provider_name }}
          </span>

          <div *ngIf="filters.streamingServices.includes(service.provider_id)"
               class="flex-shrink-0 w-4 h-4 bg-blue-500 rounded-full flex items-center justify-center ml-2">
            <svg class="w-2.5 h-2.5 text-white" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                    d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                    clip-rule="evenodd"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="filters.streamingServices.length > 0" class="mt-4 flex items-center gap-2 text-sm">
    <span class="text-gray-400">Sélectionné :</span>
    <div class="flex flex-wrap gap-1">
      <span *ngFor="let serviceId of filters.streamingServices; let last = last"
            class="text-blue-300 font-medium">
        {{ getServiceName(serviceId) }}{{ !last ? ',' : '' }}
      </span>
    </div>
    <button (click)="clearStreamingServices()"
            class="ml-2 text-xs text-gray-400 hover:text-red-400 transition-colors">
      Tout effacer
    </button>
  </div>
</div>
