<div class="mx-auto max-w-7xl px-4 lg:px-8 py-10 space-y-10">
  <!-- Header with Toggle -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-white text-2xl font-semibold">NextEpisode</h2>

    <label class="inline-flex items-center cursor-pointer gap-3">
      <span [class]="contentType() === 'movie' ? 'text-white font-medium' : 'text-gray-400'">
        Films
      </span>

      <div
        class="relative w-14 h-8 bg-gray-700 rounded-full cursor-pointer transition-all duration-300"
        (click)="toggleContentType()"
      >
        <div
          class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full transition-transform duration-300"
          [class.translate-x-6]="contentType() === 'tv'"
        ></div>
      </div>

      <span [class]="contentType() === 'tv' ? 'text-white font-medium' : 'text-gray-400'">
        Séries
      </span>
    </label>
  </div>

  <!-- Conditional Content Display -->
  @if (contentType() === 'movie') {
    <app-movies></app-movies>
  } @else {
    <app-tvshows></app-tvshows>
  }
</div>
