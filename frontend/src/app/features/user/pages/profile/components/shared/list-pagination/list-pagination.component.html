<!-- List Pagination Footer -->
<div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-700" *ngIf="totalCount > 0">
  <div class="flex items-center gap-2">
    <div class="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-full text-sm">
      <span class="w-2 h-2 bg-green-500 rounded-full"></span>
      <span class="text-gray-400">Showing</span>
      <span class="text-white font-medium">{{ currentCount }}</span>
      <span class="text-gray-500">/</span>
      <span class="text-white font-medium">{{ totalCount }}</span>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <button
      (click)="showLess()"
      [disabled]="!canShowLess"
      [ngClass]="{
        'flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm transition-colors': true,
        'opacity-50 cursor-not-allowed bg-gray-800 text-gray-400': !canShowLess,
        'bg-indigo-600 hover:bg-indigo-700 text-white': canShowLess
      }">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
      Show Less
    </button>

    <button
      (click)="showMore()"
      [disabled]="!canShowMore"
      [ngClass]="{
        'flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm transition-colors': true,
        'opacity-50 cursor-not-allowed bg-gray-800 text-gray-400': !canShowMore,
        'bg-indigo-600 hover:bg-indigo-700 text-white': canShowMore
      }">
      Show More
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
</div>
