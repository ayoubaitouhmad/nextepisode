<div class="section-header">
  <h2 class="section-title">
    <svg class="section-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12,6 12,12 16,14"></polyline>
    </svg>
    My Watchlist
  </h2>
</div>

<div class="loading-container" *ngIf="loading">
  <div class="loading-spinner">
    <svg class="animate-spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12a9 9 0 11-6.219-8.56"></path>
    </svg>
    <span>Loading watchlist...</span>
  </div>
</div>

<div class="error-message" *ngIf="errorMessage">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="15" y1="9" x2="9" y2="15"></line>
    <line x1="9" y1="9" x2="15" y2="15"></line>
  </svg>
  {{ errorMessage }}
</div>

<ng-container *ngIf="!loading && !errorMessage">

  <div class="content-section" *ngIf="watchListMovies.results.length > 0">
    <h3 class="content-section-title">
      <svg class="movie-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
        <line x1="7" y1="2" x2="7" y2="22"></line>
        <line x1="17" y1="2" x2="17" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="7" x2="7" y2="7"></line>
        <line x1="2" y1="17" x2="7" y2="17"></line>
        <line x1="17" y1="17" x2="22" y2="17"></line>
        <line x1="17" y1="7" x2="22" y2="7"></line>
      </svg>
      Movies ({{ watchListMovies.total_results }})
    </h3>
    <div class="movies-grid">
      <app-movie-card
        *ngFor="let movie of watchListMoviesToShow.results"
        [movie]="movie"
        type="favorite">
      </app-movie-card>
    </div>

    <app-list-pagination
      [currentCount]="watchListMoviesToShow.results.length"
      [totalCount]="watchListMovies.results.length"
      [minItems]="moviesDisplayCount"
      [step]="moviesDisplayCount"
      (onShowMore)="showMoreMovies()"
      (onShowLess)="showLessMovies()">
    </app-list-pagination>
  </div>

  <div class="content-section" *ngIf="watchListTvShows.results.length > 0">
    <h3 class="content-section-title">
      <svg class="tv-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
      TV Series ({{ watchListTvShows.total_results }})
    </h3>
    <div class="movies-grid">
      <app-tv-card
        *ngFor="let tvShow of watchListTvShowsToShow.results"
        [tvShow]="tvShow"
        type="favorite">
      </app-tv-card>
    </div>

    <app-list-pagination
      [currentCount]="watchListTvShowsToShow.results.length"
      [totalCount]="watchListTvShows.results.length"
      [minItems]="tvShowsDisplayCount"
      [step]="tvShowsDisplayCount"
      (onShowMore)="showMoreTvShows()"
      (onShowLess)="showLessTvShows()">
    </app-list-pagination>
  </div>

  <div class="empty-state" *ngIf="!hasContent()">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12,6 12,12 16,14"></polyline>
      </svg>
    </div>
    <h3 class="empty-title">Your watchlist is empty</h3>
    <p class="empty-description">Add movies and TV shows to your watchlist to see them here.</p>
  </div>

</ng-container>
