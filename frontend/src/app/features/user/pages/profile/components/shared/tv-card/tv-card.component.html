<div class="movie-card">
  <div class="movie-poster">
    <img [src]="getPosterUrl()" [alt]="tvShow.name" class="poster-image">
    <div class="movie-overlay">

      <!-- Rating Badge - favorite type -->
      <div class="rating-badge" *ngIf="type === 'favorite'">
        <svg class="star-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"></polygon>
        </svg>
      11
      </div>

      <!-- Watched Indicator -->
      <div class="watched-indicator" *ngIf="type === 'watched'">
        <div class="rating-badge">
          <svg class="star-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"></polygon>
          </svg>
         44
        </div>
        <div class="check-badge">
          <svg class="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20,6 9,17 4,12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Watchlist Indicator -->
      <div class="watchlist-indicator" *ngIf="type === 'watchlist'">
        <svg class="clock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12,6 12,12 16,14"></polyline>
        </svg>
      </div>

    </div>
  </div>

  <div class="movie-info">
    <h3 class="movie-title">{{ tvShow.name }}</h3>
    <p class="movie-details">{{ getYear() }} • {{ getGenres() }}</p>
  </div>
</div>
