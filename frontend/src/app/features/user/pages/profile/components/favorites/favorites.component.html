<div class="section-header">
  <h2 class="section-title">
    <svg class="section-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"></polygon>
    </svg>
    Your Favorite Movies & Shows
  </h2>
</div>

<div class="loading-container" *ngIf="loading">
  <div class="loading-spinner">
    <svg class="animate-spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12a9 9 0 11-6.219-8.56"></path>
    </svg>
    <span>Loading favorites...</span>
  </div>
</div>

<div class="error-message" *ngIf="errorMessage">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="15" y1="9" x2="9" y2="15"></line>
    <line x1="9" y1="9" x2="15" y2="15"></line>
  </svg>
  {{ errorMessage }}
</div>

<ng-container *ngIf="!loading && !errorMessage">

  <div class="content-section" *ngIf="favoriteMoviesGrouped.movies.length > 0">
    <h3 class="content-section-title">
      <svg class="movie-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
        <line x1="7" y1="2" x2="7" y2="22"></line>
        <line x1="17" y1="2" x2="17" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="7" x2="7" y2="7"></line>
        <line x1="2" y1="17" x2="7" y2="17"></line>
        <line x1="17" y1="17" x2="22" y2="17"></line>
        <line x1="17" y1="7" x2="22" y2="7"></line>
      </svg>
      Movies ({{ favoriteMoviesGrouped.movies.length }})
    </h3>
    <div class="movies-grid">
      <app-movie-card
        *ngFor="let movie of favoriteMoviesGrouped.movies"
        [movie]="movie"
        type="favorite">
      </app-movie-card>
    </div>
  </div>

  <div class="content-section" *ngIf="favoriteMoviesGrouped.tvSeries.length > 0">
    <h3 class="content-section-title">
      <svg class="tv-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
      TV Series ({{ favoriteMoviesGrouped.tvSeries.length }})
    </h3>
    <div class="movies-grid">
      <app-movie-card
        *ngFor="let movie of favoriteMoviesGrouped.tvSeries"
        [movie]="movie"
        type="favorite">
      </app-movie-card>
    </div>
  </div>

  <div class="empty-state" *ngIf="!hasContent()">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"></polygon>
      </svg>
    </div>
    <h3 class="empty-title">No favorites yet</h3>
    <p class="empty-description">Start adding movies and TV shows to your favorites to see them here.</p>
  </div>

</ng-container>
