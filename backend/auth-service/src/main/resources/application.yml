server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      poll-interval: 500ms
      quiet-period: 100ms

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:authdbuser}
    password: ${SPRING_DATASOURCE_PASSWORD:authdbpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  mvc:
    servlet:
      path: /api/v1/auth


  # ════════════════════════════════════════════════════════════
  # RabbitMQ Configuration - WITH ENVIRONMENT VARIABLES
  # ════════════════════════════════════════════════════════════
  rabbitmq:
    # ✅ FIXED: Use environment variables with fallback to service name
    # In Docker Compose: SPRING_RABBITMQ_HOST=rabbitmq (service name)
    # Locally: defaults to localhost (for running outside Docker)
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: 5000



security:
  jwt:
    secret: ${JWT_SECRET:VerySecretKeyThatShouldBeLongEnoughChangeMe}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}

logging:
  level:
    com.nextepisode: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.amqp.rabbit.connection: DEBUG

