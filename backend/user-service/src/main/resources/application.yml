server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: user-service
  devtools:
    livereload:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:userdbuser}
    password: ${SPRING_DATASOURCE_PASSWORD:userdbpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ════════════════════════════════════════════════════════════
  # RabbitMQ Configuration - WITH ENVIRONMENT VARIABLES
  # ════════════════════════════════════════════════════════════
  rabbitmq:
    # ✅ FIXED: Use environment variables with fallback to service name
    # In Docker Compose: SPRING_RABBITMQ_HOST=rabbitmq (service name)
    # Locally: defaults to localhost (for running outside Docker)
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
#    connection-timeout: 5000

  template:
    retry:
      enabled: true
      initial-interval: 1000    # Wait 1 second before first retry
      max-interval: 10000        # Max wait 10 seconds between retries
      max-attempts: 3            # Try 3 times total (1 initial + 2 retries)
      multiplier: 2.0            # Double wait time after each retry


security:
  jwt:
    secret: ${JWT_SECRET:VerySecretKeyThatShouldBeLongEnoughChangeMe}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}

logging:
  level:
    root: INFO
    com.nextepisode: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.amqp: DEBUG
    com.rabbitmq: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: loggers,health,info